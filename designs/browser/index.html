<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Codex Microscope</title>
<link rel="icon" type="image/png" href="/assets/microscope.png">
<link rel="apple-touch-icon" href="/assets/microscope.png">
<link rel="stylesheet" href="/vendor/nouislider.min.css">
<link rel="stylesheet" href="/style.css">
<script defer src="/vendor/nouislider.min.js"></script>
<script defer src="/vendor/markdown-it.min.js"></script>
<script defer src="/vendor/lucide-icons.js"></script>
<script defer src="/vendor/highlight.min.js"></script>
<script defer src="/i18n.js"></script>
<script defer src="/app.js"></script>
<script defer src="/token-usage.js"></script>
</head>
<body>
<aside>
<div class="brand"><img class="brand-icon" src="/assets/microscope.png" alt="" data-i18n="accessibility.brandAlt" data-i18n-attr="alt"> <strong data-i18n="common.brand">Codex Microscope</strong></div>
<input id="search" type="search" data-i18n="navigation.searchPlaceholder" data-i18n-attr="placeholder,aria-label" placeholder="搜索标题、项目、来源或 ID" aria-label="搜索会话">
<div class="sidebar-controls">
<div class="source-select">
<button id="filters" data-i18n="accessibility.sourceFilter" data-i18n-attr="aria-label" aria-label="按会话来源筛选" aria-haspopup="menu" aria-expanded="false" aria-controls="source-menu"><span class="source-caption" data-i18n="navigation.sourceCaption">来源</span><span id="source-value" data-i18n="navigation.sourceAll">全部来源</span><span class="source-chevron" aria-hidden="true"></span></button>
<div id="source-menu" role="menu" data-i18n="accessibility.sourceMenu" data-i18n-attr="aria-label" aria-label="会话来源" hidden></div>
</div>
<div class="list-options">
<div class="list-mode-control">
<select id="list-mode" data-i18n="accessibility.listMode" data-i18n-attr="aria-label" aria-label="会话组织方式"><option value="time" data-i18n="navigation.listMode.time">按时间</option><option value="directory" data-i18n="navigation.listMode.directory">按目录</option></select>
<span class="list-mode-chevron" aria-hidden="true"></span>
</div>
<button id="archive" data-i18n="navigation.archive.all" aria-label="归档筛选">全部</button>
<button id="refresh" data-i18n="common.refresh" data-i18n-attr="title" title="刷新"></button>
</div>
</div>
<div id="list"></div>
<div class="sidebar-footer">
<div class="locale-control">
<button id="locale-toggle" type="button" data-i18n="common.language" data-i18n-attr="aria-label,title" aria-label="语言" aria-haspopup="menu" aria-expanded="false" aria-controls="locale-menu"></button>
<div id="locale-menu" role="menu" data-i18n="common.language" data-i18n-attr="aria-label" hidden></div>
</div>
<button id="theme" data-i18n="accessibility.theme" data-i18n-attr="aria-label" aria-label="切换深浅色"></button>
</div>
</aside>
<main>
<header>
<button id="back"><span data-i18n="navigation.backSessions">会话</span></button>
<div><strong id="title" data-i18n="navigation.heroTitle">你的工作，都在这里。</strong></div>
<button id="toggle-find" hidden data-i18n="session.findOpenAria" data-i18n-attr="aria-label" aria-label="展开会话查找" aria-expanded="true" aria-controls="controls"></button>
<button id="context" hidden aria-haspopup="dialog"></button>
</header>
<section id="demo-note" hidden></section>
<section id="welcome">
<div class="mark"></div>
<h1 data-i18n="navigation.welcomeHeading">回到任意一次思考</h1>
<p data-i18n="navigation.welcomeBody">从左侧选择会话，查看对话与执行过程。<br>包括 App 列表中隐藏的 exec 会话。</p>
</section>
<div id="controls" hidden>
<input id="insearch" type="search" data-i18n="session.findPlaceholder" data-i18n-attr="placeholder,aria-label" placeholder="在当前会话中查找" aria-label="在当前会话中查找">
<button id="close-find" data-i18n="session.findCloseAria,session.findCloseTitle" data-i18n-attr="aria-label,title" aria-label="收起会话查找" title="收起查找"></button>
<span id="find-status" role="status" aria-live="polite"></span>
<button id="find-prev" data-i18n="session.findPrevAria,session.findPrevTitle" data-i18n-attr="aria-label,title" aria-label="上一处匹配" title="上一处（Shift + Enter）" disabled></button>
<button id="find-next" data-i18n="session.findNextAria,session.findNextTitle" data-i18n-attr="aria-label,title" aria-label="下一处匹配" title="下一处（Enter）" disabled></button>
</div>
<article id="messages"></article>
<div id="end"></div>
</main>
</body>
</html>
